# Database changes reach production here, not from a session's hands.
#
# Before this, AGENTS.md rule 7 sent every migration through a Claude session typing SQL into
# Supabase. That needed a session to hold a credential owning all 58 tables, it happened whenever
# Claude worked rather than when the owner chose, and a tool call in a chat is not a record anybody
# can audit later. docs/MIGRATIONS.md is the owner's page on all of this, and on how to undo it.
#
# It does NOT wait for a human. The owner's standing order is that one shot means they are not
# involved until it is finished, and they already approve twice: once in the conversation where the
# migration is designed, and once by merging the pull request that carries it. A third click after
# the merge is ceremony, not safety.
#
# `pnpm db:migrate` applies each generated .sql file in order and writes its own row in
# drizzle.__drizzle_migrations. It never infers the schema from the code, so it cannot drop the Row
# Level Security policies. That is exactly why `pnpm db:push` is disabled and this is not.
name: Migrate

on:
  push:
    branches: [main]
    # A migration, or a change to the two files that apply one. A copy fix must not wake the owner.
    #
    # The runner and this file were out of this list until the first real run failed inside
    # scripts/migrate.ts. A fix to the thing that applies migrations has to prove itself, and it can
    # only do that by running: a run with nothing pending applies nothing and takes twenty seconds.
    paths:
      - "drizzle/**"
      - "scripts/migrate.ts"
      - ".github/workflows/migrate.yml"
  # So a migration that failed can be run again without an empty commit.
  workflow_dispatch:

concurrency:
  # Never two of these at once: a migration half-applied by two runners is the one thing worse than
  # a migration that did not run.
  group: migrate-production
  cancel-in-progress: false

jobs:
  migrate:
    name: Apply pending migrations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: What is about to run
        run: |
          echo "Migration files in this commit:"
          git show --stat --oneline HEAD -- drizzle/ || true
      - name: Apply
        run: pnpm db:migrate
        env:
          # The direct (port 5432) connection. A migration changes the shape of tables, and the
          # pooler shares one connection between callers, so it cannot do that safely.
          DIRECT_DATABASE_URL: ${{ secrets.DIRECT_DATABASE_URL }}
