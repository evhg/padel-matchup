name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  checks:
    name: Typecheck, lint, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kicksmash_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - name: Schema and migrations agree
        run: bash scripts/check-migrations.sh
      - name: Unit tests (embedded PGlite)
        run: pnpm test
      - name: Unit tests (real Postgres, true concurrency)
        run: pnpm test
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/kicksmash_test

  e2e:
    name: Build and browser journeys (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Two jobs, each with its own build and server, each running every second suite (E2E_SHARD in e2e/run.mjs).
        shard: ["1/2", "2/2"]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The runner image carries Google's Chrome apt source, which has served mismatched indexes and broke apt-get update
      # inside --with-deps twice in one evening. Playwright's system packages come from Ubuntu's own repositories.
      - run: sudo rm -f /etc/apt/sources.list.d/google-chrome* /etc/apt/sources.list.d/google.list
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
        env:
          APP_BASE_URL: http://localhost:3001
      - name: End-to-end (fresh PGlite, dummy email key, generated VAPID keys)
        run: pnpm e2e
        env:
          SHOTS: e2e-shots
          E2E_SHARD: ${{ matrix.shard }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshots-${{ strategy.job-index }}
          path: e2e-shots
          if-no-files-found: ignore
          retention-days: 7
